<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><script>
(function(){
  var sw=Math.min(screen.width||9999,screen.height||9999);
  var phone=sw<=760;
  if(phone) document.documentElement.classList.add('mobile-capable');
  function normalizeViewport(){
    var m=document.querySelector('meta[name="viewport"]');
    if(!m){m=document.createElement('meta');m.name='viewport';document.head.insertBefore(m,document.head.firstChild);}
    if(phone){
      var vw=Math.max(320,Math.min(sw,640));
      m.setAttribute('content','width='+vw+', initial-scale=1, viewport-fit=cover');
    }else{
      m.setAttribute('content','width=device-width, initial-scale=1, viewport-fit=cover');
    }
  }
  normalizeViewport();
  window.addEventListener('pageshow',normalizeViewport);
  window.addEventListener('focus',normalizeViewport);
  window.addEventListener('orientationchange',function(){setTimeout(normalizeViewport,80);});
})();
</script><meta name="theme-color" content="#F8FAFC"/><link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet"/><meta name="description" content="أبو خالد - منصة ذكية للعروض والتوفير"/><title>أبو خالد | وفّر قبل ما تدفع</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
