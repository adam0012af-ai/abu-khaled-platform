name: build-check

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
        continue-on-error: true
      - run: npm install
      - run: npm run build
